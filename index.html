<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Login</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">
    <!-- tailwind and daisy ui setup -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- google-fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <!-- font-awesome-cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>

<body class="min-h-screen max-w-md mx-auto bg-base-200">
    <div class="w-[200px] mx-auto pt-32">
        <img src="./assets/Logo-full.png" alt="">
    </div>
    <div class="form pt-10">
        <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl mx-auto">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label font-medium">Mobile Number</label>
                    <input maxlength="11" minlength="11" type="email" class="input rounded-full bg-[#F4F5F7] text-black"
                        placeholder="Enter your number" id="input-number" />
                    <br>

                    <label class="label font-bold">4 Digit Pin</label>
                    <input maxlength="4" minlength="4" type="password"
                        class="input rounded-full bg-[#F4F5F7] text-black" placeholder="Enter 4 Digit Pin"
                        id="input-pin" />
                    <button class="btn btn-primary mt-4 rounded-full" id="login-btn">Login</button>
                </fieldset>
            </div>
        </div>
    </div>
    <script src="./login.js"></script>
</body>

</html>
